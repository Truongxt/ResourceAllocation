name: Deploy Frontend to x10hosting (FTP)

on:
  push:
    branches:
      - main
      - uat
    paths:
      - 'client/**'
      - '.github/workflows/deploy-frontend-ftp.yml'
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Build Frontend
        env:
          VITE_API_URL: https://optiwork-api.onrender.com/api
          VITE_SOCKET_URL: https://optiwork-api.onrender.com
        run: |
          cd client
          npm run build

      - name: Generate .htaccess for SPA routing
        run: |
          cat << 'EOF' > client/dist/.htaccess
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

      - name: Determine Target Directory
        id: target-dir
        run: |
          if [ "${{ github.ref }}" = "refs/heads/uat" ]; then
            echo "dir=./domains/optiwork.x10.mx/public_html/uat/" >> $GITHUB_OUTPUT
            echo "Deploying to UAT environment..."
          else
            echo "dir=./domains/optiwork.x10.mx/public_html/" >> $GITHUB_OUTPUT
            echo "Deploying to Production environment..."
          fi

      - name: Sync files to x10hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./client/dist/
          server-dir: ${{ steps.target-dir.outputs.dir }}
          dangerous-clean-slate: false
