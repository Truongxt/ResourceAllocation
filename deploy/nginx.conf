# Cấu hình Nginx cho Domain chạy trên VPS Linux (Ubuntu / Debian)
# Thay yourdomain.com bằng tên miền thực tế của bạn

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Chuyển hướng toàn bộ HTTP sang HTTPS (sau khi chạy certbot)
    # return 301 https://$host$request_uri;

    # Thư mục chứa mã nguồn Frontend đã build (dist)
    root /var/www/resource-allocation/client/dist;
    index index.html;

    # Gzip nén dữ liệu
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache tài nguyên tĩnh
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy sang PM2 Backend Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Socket.IO Realtime WebSocket Proxy
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback cho Single Page Application (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
